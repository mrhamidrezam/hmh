<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="hmh — read-only project analyzer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#111a24"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f7df1e"/>
      <stop offset="18%" stop-color="#3178c6"/>
      <stop offset="36%" stop-color="#e34c26"/>
      <stop offset="54%" stop-color="#3572a5"/>
      <stop offset="72%" stop-color="#dea584"/>
      <stop offset="88%" stop-color="#2cbea1"/>
      <stop offset="100%" stop-color="#a8b9cc"/>
    </linearGradient>
    <linearGradient id="prism" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#8ab4f8"/>
      <stop offset="100%" stop-color="#c792ea"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- incoming beam -->
  <path d="M40 150 L250 150" stroke="#e6edf3" stroke-width="4" stroke-linecap="round" opacity="0.85"/>

  <!-- prism -->
  <path d="M250 96 L330 204 L170 204 Z" fill="none" stroke="url(#prism)" stroke-width="4" stroke-linejoin="round"/>
  <path d="M250 118 L302 190 L198 190 Z" fill="url(#prism)" opacity="0.10"/>

  <!-- dispersed spectrum -->
  <g stroke-linecap="round" opacity="0.95">
    <path d="M312 168 L700 96"  stroke="#f7df1e" stroke-width="4"/>
    <path d="M316 172 L700 118" stroke="#3178c6" stroke-width="4"/>
    <path d="M320 176 L700 140" stroke="#e34c26" stroke-width="4"/>
    <path d="M322 180 L700 162" stroke="#3572a5" stroke-width="4"/>
    <path d="M320 184 L700 184" stroke="#dea584" stroke-width="4"/>
    <path d="M316 188 L700 206" stroke="#2cbea1" stroke-width="4"/>
    <path d="M312 192 L700 228" stroke="#a8b9cc" stroke-width="4"/>
  </g>

  <!-- wordmark -->
  <text x="742" y="168" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="104" font-weight="800" fill="#e6edf3" letter-spacing="-4">hmh</text>
  <text x="748" y="212" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="27" font-weight="500" fill="#8b98a9" letter-spacing="0.5">split any project into its spectrum</text>

  <rect x="40" y="262" width="1120" height="6" rx="3" fill="url(#spectrum)" opacity="0.85"/>
</svg>
