[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "hmh"
dynamic = ["version"]
description = "Read-only project analyzer: lines of code, languages, sizes and structure — without ever touching your files."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "Hamidreza", email = "h4midrezam@gmail.com" }]
keywords = [
    "analyzer",
    "statistics",
    "loc",
    "sloc",
    "cloc",
    "language-detection",
    "codebase",
    "repository",
    "report",
    "read-only",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Utilities",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/mrhamidrezam/hmh"
Repository = "https://github.com/mrhamidrezam/hmh"
Issues = "https://github.com/mrhamidrezam/hmh/issues"

[project.scripts]
hmh = "hmh.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1.2", "twine>=5"]

[tool.hatch.version]
path = "src/hmh/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/hmh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"
